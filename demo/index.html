<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高德地图 - 货车导航</title>
<style>
/* ============ amap.com/dir 同款: 全屏高德地图 + 浮动面板 ============ */
:root{
  --amap-blue:#0f89f5; --amap-blue-d:#0c6ec4;
  --panel-blue:#21518b; --panel-blue-2:#1d4a81;
  --ink:#333; --ink-2:#5f6477; --ink-3:#8c989f;
  --line:#e8e8e8; --line-2:#cbcccd;
  --warn:#ff9f1c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:var(--ink)}

#themap{position:absolute;inset:0;z-index:0;background:#e8f0f8;overflow:hidden;cursor:grab}
#themap:active{cursor:grabbing}
#tilecanvas{position:absolute;inset:0}
#tilecanvas img{user-select:none;-webkit-user-drag:none;pointer-events:none}
#ovl{position:absolute;inset:0;pointer-events:none}

/* ---- 顶部通栏 ---- */
#topbar{position:absolute;top:0;left:0;right:0;height:52px;z-index:2000;display:flex;align-items:center;padding:0 16px;gap:12px;background:rgba(255,255,255,.96);box-shadow:0 1px 4px rgba(0,0,0,.08)}
#topbar .brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:#222}
#topbar .brand .mk{width:28px;height:28px;border-radius:50%;background:var(--amap-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
#topbar .brand em{font-style:normal;color:var(--amap-blue)}
#topbar .tools{margin-left:auto;display:flex;gap:2px}
#topbar .tools button{padding:6px 14px;border-radius:3px;color:var(--ink-2);font-size:13px}
#topbar .tools button:hover{background:#f0f7ff;color:var(--amap-blue)}
#topbar .tools button.on{color:var(--amap-blue);font-weight:600;background:#e8f4ff}

/* ---- 左上路线面板 ---- */
#dirbox{position:absolute;left:16px;top:68px;width:360px;z-index:2200;filter:drop-shadow(0 4px 14px rgba(9,30,60,.35))}
.dpanel{background:var(--panel-blue);border-radius:4px;overflow:hidden}
.dhead{display:flex;align-items:center;padding:10px 14px 4px;gap:4px}
.dhead .modes{display:flex;gap:2px}
.dhead .mode{padding:7px 14px;border-radius:14px 14px 0 0;color:#bcd4ef;font-size:13px}
.dhead .mode.on{background:#fff;color:var(--panel-blue);font-weight:700}
.dhead .close{margin-left:auto;color:#9db9d8;font-size:16px;padding:4px 8px}
.dhead .close:hover{color:#fff}

.dbody{background:#fff;padding:12px 14px;max-height:calc(100vh - 260px);overflow:auto}
.irow{display:flex;gap:8px}
.irow .swap{display:flex;flex-direction:column;gap:3px;color:#9bb7d6;font-size:11px;line-height:1;padding:12px 0}
.irow .dots{display:flex;flex-direction:column;align-items:center;gap:14px;padding:12px 0 14px}
.irow .dot{width:9px;height:9px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #9bb7d6;background:#fff}
.irow .dot.from{background:#8ce08c}
.irow .dot.to{background:#ff7a7a}
.ipts{flex:1;background:#f4f6f8;border-radius:3px;overflow:hidden}
.ipt{display:flex;align-items:center;height:40px;padding:0 10px;gap:8px}
.ipt+.ipt{border-top:1px solid #e6eaef}
.ipt .tag{flex:none;font-size:12px;color:#fff;border-radius:2px;padding:1px 5px}
.ipt .tag.f{background:#38a83a}.ipt .tag.t{background:#e05252}
.ipt input{flex:1;border:none;background:none;outline:none;font-size:13.5px}
.ipt input::placeholder{color:#aab4bf}

.truckrow{display:flex;gap:6px;margin:10px 0 4px}
.tcard{flex:1;border:1px solid var(--line-2);border-radius:4px;text-align:center;padding:6px 2px 5px;background:#fff;transition:.12s}
.tcard:hover{border-color:var(--amap-blue)}
.tcard.on{border:1.5px solid var(--amap-blue);background:#eef7ff;box-shadow:0 0 0 2px rgba(15,137,245,.12)}
.tcard .ic{font-size:17px;line-height:1.2}
.tcard b{display:block;font-size:12px}
.tcard i{font-style:normal;display:block;font-size:10px;color:var(--ink-3);line-height:1.3}
.tcard.on b{color:var(--amap-blue)}

.stratrow{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.schip{border:1px solid var(--line-2);border-radius:13px;padding:3px 11px;font-size:12px;color:var(--ink-2);background:#fff}
.schip:hover{border-color:var(--amap-blue);color:var(--amap-blue)}
.schip.on{background:var(--amap-blue);border-color:var(--amap-blue);color:#fff;font-weight:600}

.more-toggle{color:var(--amap-blue);font-size:12.5px;padding:6px 0;display:flex;align-items:center;gap:4px}
.more-toggle:hover{text-decoration:underline}
.more{display:none;padding:8px 10px;background:#f7f9fb;border-radius:4px;margin:4px 0 8px}
.more.show{display:block}
.more .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.more .g2{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.more label{font-size:11px;color:var(--ink-3);display:block;margin-bottom:2px}
.more input{width:100%;height:32px;border:1px solid var(--line-2);border-radius:3px;padding:0 8px;outline:none;background:#fff}
.more input:focus{border-color:var(--amap-blue)}
.viarow{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.viarow input{flex:1;height:32px;border:1px solid var(--line-2);border-radius:3px;padding:0 8px;outline:none}
.viarow .del{color:#c2cad3;font-size:15px;padding:0 4px}
.viarow .del:hover{color:#e05252}
.via-add{color:var(--amap-blue);font-size:12.5px;padding:2px 0 6px}
.via-add:hover{text-decoration:underline}
.via-n{font-size:11px;color:var(--ink-3)}

.gobtn{width:100%;height:42px;margin-top:6px;background:var(--amap-blue);color:#fff;border-radius:4px;font-size:15px;font-weight:700;letter-spacing:4px;box-shadow:0 3px 8px rgba(15,137,245,.3)}
.gobtn:hover{background:var(--amap-blue-d)}
.gobtn[disabled]{opacity:.6;cursor:wait}

/* ---- 方案列表 ---- */
.planlist{background:#fff;border-radius:0 0 4px 4px;max-height:calc(100vh - 260px);overflow:auto;display:none}
.plan-h{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#f7fafd;position:sticky;top:0}
.plan-h b{font-size:13.5px}
.plan-h .back{margin-left:auto;color:var(--amap-blue);font-size:12.5px}
.plansum{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.psum{flex:1;text-align:center;padding:6px 4px;background:#f4f9ff;border-radius:4px}
.psum .v{font-size:15px;font-weight:800;color:var(--panel-blue)}
.psum .v small{font-size:10px;font-weight:400;color:var(--ink-3)}
.psum .k{font-size:11px;color:var(--ink-3)}
.plan{border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;transition:.12s}
.plan:hover{background:#f4f9ff}
.plan.on{background:#eef7ff}
.plan .tt{display:flex;align-items:baseline;gap:8px}
.plan .tt .n{font-size:12px;color:#fff;background:var(--amap-blue);border-radius:3px;padding:1px 7px}
.plan.on .tt .n{background:var(--panel-blue)}
.plan .tt .d{font-size:15px;font-weight:700}
.plan .tt .t{font-size:12.5px;color:var(--ink-2)}
.plan .tt .fee{margin-left:auto;font-size:12.5px;color:#e08a00}
.plan .meta{font-size:12px;color:var(--ink-3);margin-top:3px}
.detail{display:none;border-top:1px dashed var(--line-2);margin-top:8px}
.plan.on .detail{display:block}
.dstep{display:flex;gap:10px;padding:7px 2px;border-bottom:1px solid #f3f6f9;font-size:12.5px}
.dstep:last-child{border-bottom:none}
.dstep .no{flex:none;width:20px;height:20px;border-radius:50%;background:#e3f1ff;color:var(--amap-blue);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.dstep .rd{color:var(--ink-3)}
.dstep .cam{color:var(--warn);font-size:11.5px}

/* 代码抽屉 */
#codebox{position:absolute;left:16px;bottom:34px;z-index:1600;background:#0a1830;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.3);width:540px;max-width:calc(100vw - 32px);overflow:hidden;display:none}
#codebox.show{display:block}
#codebox .ch{display:flex;align-items:center;padding:8px 12px;gap:2px}
#codebox .ch button{color:#7d94b8;font-size:12px;padding:5px 12px;border-radius:4px}
#codebox .ch button.on{color:#fff;background:rgba(255,255,255,.12);font-weight:600}
#codebox .ch .x{margin-left:auto;color:#7d94b8;font-size:15px;padding:2px 8px}
#codebox pre{margin:0;padding:10px 14px 14px;color:#d6e2f0;font:11.5px/1.7 ui-monospace,Menlo,monospace;overflow:auto;max-height:200px}
#codebox .c{color:#5d7290}#codebox .s{color:#8ce99a}#codebox .k{color:#74c0fc}#codebox .n{color:#ffc078}

#copyright{position:absolute;left:0;right:0;bottom:0;z-index:1400;font-size:10.5px;color:#7d8894;text-align:center;background:rgba(255,255,255,.65);padding:2px 0;pointer-events:none}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(-14px);background:rgba(20,40,70,.92);color:#fff;padding:9px 22px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:3000}
#toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<div id="themap"><div id="tilecanvas"></div><svg id="ovl" xmlns="http://www.w3.org/2000/svg"></svg></div>

<div id="topbar">
  <div class="brand"><div class="mk">货</div>高德<em>货车导航</em><span style="font-size:11px;color:#98a6b8;font-weight:400">amap-truck-nav</span></div>
  <div class="tools">
    <button class="on" id="btnDir">路线</button>
    <button id="btnCode">&lt;/&gt; 代码</button>
    <button id="btnCam" class="on">📷 电子眼</button>
  </div>
</div>

<section id="dirbox">
  <div class="dpanel">
    <div class="dhead">
      <div class="modes">
        <button class="mode on">🚛 货车</button>
        <button class="mode" onclick="toast('本页只接货车引擎')">🚗 小车</button>
      </div>
      <button class="close" onclick="window.__reset()">✕</button>
    </div>
    <div class="dbody" id="inputBody">
      <div class="irow">
        <div class="swap"><span>⬆</span><span>⬇</span></div>
        <div class="dots"><span class="dot from"></span><span class="dot to"></span></div>
        <div class="ipts">
          <div class="ipt"><span class="tag f">起</span><input id="origin" placeholder="经度,纬度" value="116.481008,39.989625"></div>
          <div class="ipt"><span class="tag t">终</span><input id="dest" placeholder="经度,纬度" value="121.499718,31.239703"></div>
        </div>
      </div>

      <div class="more-toggle" id="viaToggle">＋ 途经点 <span class="via-n" id="viaN"></span></div>
      <div class="more" id="viaBox">
        <div id="viaList"></div>
        <button class="via-add" id="viaAdd">＋ 添加 (≤16, 顺序途经)</button>
      </div>

      <div class="truckrow" id="sizes">
        <button class="tcard" data-v="1"><span class="ic">🛻</span><b>微型</b><i>≤3.5m<br>≤1.8t</i></button>
        <button class="tcard on" data-v="2"><span class="ic">🚚</span><b>轻型</b><i>&lt;6m<br>&lt;4.5t</i></button>
        <button class="tcard" data-v="3"><span class="ic">🚛</span><b>中型</b><i>≥6m<br>4.5-12t</i></button>
        <button class="tcard" data-v="4"><span class="ic">🏗️</span><b>重型</b><i>≥6m<br>≥12t</i></button>
      </div>

      <div class="stratrow" id="strats"></div>

      <div class="more-toggle" id="moreToggle">车辆参数 · 车牌 ▾</div>
      <div class="more" id="moreBox">
        <div class="g">
          <div><label>车高 m</label><input id="height" type="number" step="0.1" placeholder="4.0"></div>
          <div><label>车宽 m</label><input id="width" type="number" step="0.01" placeholder="2.55"></div>
          <div><label>轴数</label><input id="axis" type="number" placeholder="6"></div>
        </div>
        <div class="g" style="grid-template-columns:1fr 1fr">
          <div><label>总重 t</label><input id="load" type="number" step="0.1" placeholder="31"></div>
          <div><label>核定载重 t</label><input id="weight" type="number" step="0.1" placeholder="20"></div>
        </div>
        <div class="g2">
          <div><label>车牌省</label><input id="province" value="京" maxlength="1"></div>
          <div><label>车牌号</label><input id="pnumber" value="A12345"></div>
        </div>
      </div>

      <button class="gobtn" id="go">搜 索</button>
    </div>
  </div>
  <div class="planlist" id="planList"></div>
</section>

<div id="codebox">
  <div class="ch">
    <button class="on" data-t="js">JS / ESM</button>
    <button data-t="curl">cURL</button>
    <button data-t="resp">响应</button>
    <button class="x" onclick="codebox.classList.remove('show')">✕</button>
  </div>
  <pre id="codeView"></pre>
</div>

<div id="copyright">amap-truck-nav demo · 高德APP货车导航通道(私有接口逆向, 仅供研究) · GCJ-02</div>
<div id="toast"></div>

<script type="module">
import { truckRoute } from '../src/index.js';
import { setServer } from '../src/api.js';
setServer(location.origin);
const $ = (id) => document.getElementById(id);
const codebox = $('codebox');
const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); };

/* ---- 自绘瓦片地图 (纯同源 /_amaptile, 无外网依赖) ---- */
const TILE = 256;
const map = (() => {
  const el = document.getElementById('tilecanvas');
  const st = { zoom: 5, cx: 118.5, cy: 33.5, origin: [0, 0], W: 0, H: 0 };
  const px = (lng, lat) => {
    const n = 2 ** st.zoom;
    const xt = (lng + 180) / 360 * n;
    const yt = (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * n;
    return [xt * TILE, yt * TILE];
  };
  const toScreen = (lng, lat) => { const [wx, wy] = px(lng, lat); return [wx - st.origin[0], wy - st.origin[1]]; };
  let overlays = { segs: [], cams: [], pts: [], via: [] };
  let camOn = true;                          // 电子眼显隐 (顶栏开关)
  const drawOvl = () => {
    const svg = document.getElementById('ovl');
    if (!st.W) return;
    svg.setAttribute('viewBox', `0 0 ${st.W} ${st.H}`);
    svg.setAttribute('width', st.W); svg.setAttribute('height', st.H);
    let h = '';
    // 路线 polyline (v3 真实几何, 白描边+主蓝)
    for (const seg of overlays.segs) {
      const dd = seg.map((p, i) => (i ? 'L' : 'M') + toScreen(p[0], p[1]).map(v => v.toFixed(1)).join(',')).join('');
      h += `<path d="${dd}" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`;
      h += `<path d="${dd}" fill="none" stroke="#0f89f5" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    // 电子眼散点 (数据源无序, 只画点不连线 — 连线会产生横杠, 已由审查证实)
    if (camOn) for (const c of overlays.cams) {
      const [x, y] = toScreen(c[0], c[1]);
      h += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${st.zoom >= 8 ? 4 : 2.5}" fill="#ff9f1c" fill-opacity="${st.zoom >= 8 ? 1 : .75}" stroke="#fff" stroke-width="1.5"/>`;
    }
    const pin = (p, color, r = 7) => {
      const [x, y] = toScreen(p[0], p[1]);
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}" stroke="#fff" stroke-width="3"/>`;
    };
    if (overlays.pts.length >= 2) { h += pin(overlays.pts[0], '#38a83a'); h += pin(overlays.pts[1], '#e05252'); }
    for (const v of overlays.via) h += pin(v, '#0f89f5');
    svg.innerHTML = h;
  };
  const setCam = (on) => { camOn = on; drawOvl(); };
  const render = () => {
    const W = innerWidth, H = innerHeight;
    const [cxp, cyp] = px(st.cx, st.cy);
    st.origin = [cxp - W / 2, cyp - H / 2]; st.W = W; st.H = H;
    const x0 = Math.floor(st.origin[0] / TILE), x1 = Math.floor((st.origin[0] + W) / TILE);
    const y0 = Math.floor(st.origin[1] / TILE), y1 = Math.floor((st.origin[1] + H) / TILE);
    let html = '';
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      if (ty < 0 || ty >= 2 ** st.zoom) continue;
      html += `<img draggable="false" src="/_amaptile/${st.zoom}/${tx}/${ty}" style="position:absolute;left:${tx * TILE - st.origin[0]}px;top:${ty * TILE - st.origin[1]}px;width:${TILE}px;height:${TILE}px" onerror="this.style.visibility='hidden'">`;
    }
    el.innerHTML = html;
    drawOvl();
  };
  const setOverlays = (o) => { overlays = o; drawOvl(); };
  const fit = (pts) => {
    const lngs = pts.map(p => p[0]), lats = pts.map(p => p[1]);
    const bbox = [Math.min(...lngs), Math.min(...lats), Math.max(...lngs), Math.max(...lats)];
    let z = 10;
    for (; z >= 4; z--) {
      st.zoom = z;
      const a = px(bbox[0], bbox[3]), b = px(bbox[2], bbox[1]);
      if (b[0] - a[0] < innerWidth * .8 && a[1] - b[1] < innerHeight * .8) break;
    }
    st.zoom = Math.max(4, z);
    st.cx = (bbox[0] + bbox[2]) / 2; st.cy = (bbox[1] + bbox[3]) / 2;
    render();
  };
  let drag = null;
  const mapEl = document.getElementById('themap');
  mapEl.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, origin: [...st.origin] }; e.preventDefault(); });
  addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = (e.clientX - drag.x), dy = (e.clientY - drag.y);
    const n = 2 ** st.zoom;
    const xt = (drag.origin[0] + innerWidth / 2 - dx) / TILE;
    const yt = (drag.origin[1] + innerHeight / 2 - dy) / TILE;
    st.cx = xt / n * 360 - 180;
    const ycy = Math.PI * (1 - 2 * yt / n);
    if (ycy > -1.55 && ycy < 1.55) st.cy = Math.atan(Math.sinh(ycy)) * 180 / Math.PI;
    render();
  });
  const endDrag = () => { drag = null; };
  addEventListener('mouseup', endDrag);
  addEventListener('blur', endDrag);
  addEventListener('wheel', e => {
    e.preventDefault();
    const old = st.zoom;
    st.zoom = Math.max(4, Math.min(18, st.zoom + (e.deltaY < 0 ? 1 : -1)));
    if (st.zoom !== old) render();
  }, { passive: false });
  addEventListener('resize', render);
  render();
  return { getZoom: () => st.zoom, setOverlays, setCam, fit, st, render };
})();
window.__map = map;

function drawRoute(resp, planIdx) {
  const o = resp.data.route.origin.split(',').map(Number);
  const d = resp.data.route.destination.split(',').map(Number);
  const path = resp.data.route.paths[planIdx] ?? resp.data.route.paths[0];
  // 路线几何: v3 沿货车走廊补全的 polyline (后端混合产物; 无则退化为散点)
  const poly = path.polyline;
  const segs = poly
    ? [poly.split(';').map(p => p.split(',').map(Number))]
    : [];
  // 电子眼散点 (数据源乱序, 只画点)
  const cams = (path.steps ?? [])
    .flatMap(s => (s.cameras ?? []).map(c => [ +c.x, +c.y ]));
  map.setOverlays({ segs, cams, pts: [o, d], via: [] });
  map.fit([o, d, ...(segs[0] ?? cams)]);
  toast(segs.length
    ? `路线已绘制: polyline ${segs[0].length} 点 · 高速里程 ${(path.toll_distance/1000).toFixed(0)}km`
    : `已定位: 起→终 · ${cams.length} 电子眼 (散点)`);
}
window.__draw = drawRoute;

let camOn = true;
$('btnCam').onclick = () => {
  camOn = !camOn;
  $('btnCam').classList.toggle('on', camOn);
  map.setCam(camOn);
};

/* ---- 表单 (同前) ---- */
const STRATS = [[11,'高德推荐'],[1,'躲拥堵'],[3,'避收费'],[8,'高速优先'],[13,'距离优先'],[2,'不走高速'],[4,'躲堵+不走高速'],[5,'避费+不走高速'],[6,'躲堵+避费'],[7,'全避'],[9,'躲堵+高速'],[10,'无路况速度'],[12,'无路况不走高速']];
const state = { size: 2, strategy: 11, resp: null, planIdx: 0 };

STRATS.forEach(([v, l], i) => {
  const b = document.createElement('button');
  b.className = 'schip' + (i ? '' : ' on'); b.textContent = l;
  b.onclick = () => { state.strategy = v; $('strats').querySelectorAll('.schip').forEach(x => x.classList.remove('on')); b.classList.add('on'); };
  $('strats').appendChild(b);
});
$('sizes').querySelectorAll('.tcard').forEach(c => c.onclick = () => {
  state.size = +c.dataset.v;
  $('sizes').querySelectorAll('.tcard').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
});
$('moreToggle').onclick = () => $('moreBox').classList.toggle('show');
$('viaToggle').onclick = () => $('viaBox').classList.toggle('show');
$('btnCode').onclick = () => { codebox.classList.toggle('show'); genCode(); };
$('btnDir').onclick = () => { $('inputBody').parentElement.style.display = ''; $('planList').style.display = 'none'; };

function addVia(val = '') {
  if ($('viaList').children.length >= 16) { toast('最多 16 个途经点'); return; }
  const row = document.createElement('div'); row.className = 'viarow';
  const inp = document.createElement('input'); inp.value = val; inp.placeholder = '117.120464,36.651501';
  const del = document.createElement('button'); del.className = 'del'; del.textContent = '×';
  del.onclick = () => { row.remove(); viaN(); };
  row.append(inp, del); $('viaList').appendChild(row); viaN();
}
function viaN() { const n = $('viaList').children.length; $('viaN').textContent = n ? `(${n}/16)` : ''; }
$('viaAdd').onclick = () => addVia();

function collectOpts() {
  const ll = s => s.split(',').map(Number);
  const o = { origin: ll($('origin').value.trim()), destination: ll($('dest').value.trim()), size: state.size, strategy: state.strategy, province: $('province').value.trim(), number: $('pnumber').value.trim() };
  const vias = [...$('viaList').children].map(r => r.querySelector('input').value.trim()).filter(Boolean);
  if (vias.length) o.waypoints = vias.map(ll);
  for (const id of ['height','width','load','weight','axis']) if ($(id).value !== '') o[id] = +$(id).value;
  return o;
}

let codeTab = 'js';
codebox.querySelectorAll('.ch button[data-t]').forEach(t => t.onclick = () => {
  codeTab = t.dataset.t;
  codebox.querySelectorAll('.ch button[data-t]').forEach(x => x.classList.remove('on'));
  t.classList.add('on'); genCode();
});
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function genCode() {
  const o = collectOpts();
  const viaStr = o.waypoints ? o.waypoints.map(w=>`[${w.join(', ')}]`).join(', ') : null;
  let html = '';
  if (codeTab === 'js') {
    html = `<span class="c">// npm i amap-truck-nav</span>\n<span class="k">import</span> { truckRoute } <span class="k">from</span> <span class="s">'amap-truck-nav'</span>;\n<span class="k">const</span> resp = <span class="k">await</span> truckRoute({\n  origin: [<span class="n">${o.origin.join(', ')}</span>],\n  destination: [<span class="n">${o.destination.join(', ')}</span>],${viaStr?`\n  waypoints: [${viaStr}],`:''}\n  size: <span class="n">${o.size}</span>, strategy: <span class="n">${o.strategy}</span>,\n  province: <span class="s">'${o.province}'</span>, number: <span class="s">'${o.number}'</span>,\n});`;
  } else if (codeTab === 'curl') {
    const p = new URLSearchParams({ origin: o.origin.join(','), destination: o.destination.join(','), size: o.size, strategy: o.strategy });
    if (o.waypoints) p.set('waypoints', o.waypoints.map(w=>w.join(',')).join(';'));
    for (const k of ['height','width','load','weight','axis']) if (o[k]!==undefined) p.set(k, o[k]);
    html = `curl <span class="s">'${location.origin}/v4/direction/truck?${esc(p.toString())}'</span>`;
  } else {
    const s = state.resp ? {d:0} : {d:0};
    const p0 = state.resp ? state.resp.data.route.paths[0] : { distance: 1221617, duration: 59420, tolls: 650, steps: [] };
    html = `<span class="k">"paths"</span>: [{\n  <span class="k">"distance"</span>: <span class="n">${p0.distance}</span>, <span class="k">"duration"</span>: <span class="n">${p0.duration}</span>, <span class="k">"tolls"</span>: <span class="n">${p0.tolls??0}</span>,\n  <span class="k">"steps"</span>: [{ <span class="k">"instruction"</span>: <span class="s">"沿…行驶41米右转"</span>, <span class="k">"road"</span>: <span class="s">"无名道路"</span>, <span class="k">"distance"</span>: <span class="n">41</span>,\n    <span class="k">"cameras"</span>: [{ <span class="k">"x"</span>: <span class="s">"116.7647"</span>, <span class="k">"y"</span>: <span class="s">"39.9895"</span> }] }]\n}]`;
  }
  $('codeView').innerHTML = html;
}

let running = false;
const fmtKm = m => (m/1000).toFixed(1).replace(/\.0$/,'')+'公里';
const fmtDur = s => { const h=Math.floor(s/3600),m=Math.round(s%3600/60); return h?`${h}小时${m}分`:`${m}分钟`; };
$('go').onclick = async () => {
  if (running) return;
  let o; try { o = collectOpts(); } catch { toast('坐标格式: 经度,纬度'); return; }
  running = true; $('go').disabled = true; $('go').textContent = '算路中…';
  try {
    const resp = await truckRoute(o);
    state.resp = resp; state.planIdx = 0;
    renderPlans(); drawRoute(resp, 0); genCode();
    $('inputBody').parentElement.style.display = 'none';
    $('planList').style.display = '';
  } catch (e) { toast('失败: ' + e.message); }
  finally { running = false; $('go').disabled = false; $('go').textContent = '搜 索'; }
};

function renderPlans() {
  const paths = state.resp.data.route.paths;
  const p0 = paths[0];
  let h = `<div class="plan-h"><b>货车方案</b><span style="font-size:11px;color:#8c98af;margin-left:8px">${paths.length}条</span><button class="back" onclick="__reset()">修改条件</button></div>`;
  h += `<div class="plansum">
    <div class="psum"><div class="v">${fmtKm(p0.distance)}</div><div class="k">距离</div></div>
    <div class="psum"><div class="v">${fmtDur(p0.duration)}</div><div class="k">耗时</div></div>
    <div class="psum"><div class="v">${p0.tolls||0}<small> 元</small></div><div class="k">过路费</div></div>
    <div class="psum"><div class="v">${p0.steps.reduce((n,s)=>n+(s.cameras?.length||0),0)}</div><div class="k">电子眼</div></div>
  </div>`;
  paths.forEach((p, i) => {
    h += `<div class="plan${i===state.planIdx?' on':''}" data-i="${i}">
      <div class="tt"><span class="n">方案${i+1}</span><span class="d">${fmtKm(p.distance)}</span><span class="t">${fmtDur(p.duration)}</span>${p.tolls?`<span class="fee">¥${p.tolls}</span>`:''}</div>
      <div class="meta"><span>${p.steps.length}步</span></div>
      <div class="detail">${p.steps.map((st,j)=>`<div class="dstep"><span class="no">${j+1}</span><span>${st.instruction||''} ${st.road?`<span class="rd">· ${st.road}</span>`:''}${st.cameras&&st.cameras.length?`<span class="cam"> 📷${st.cameras.length}</span>`:''}</span></div>`).join('')}</div>
    </div>`;
  });
  $('planList').innerHTML = h;
  $('planList').style.display = '';
  $('planList').querySelectorAll('.plan').forEach(el => el.onclick = () => {
    state.planIdx = +el.dataset.i;
    $('planList').querySelectorAll('.plan').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    drawRoute(state.resp, state.planIdx);   // 切方案 → 地图同步
  });
}
window.__reset = () => {
  $('inputBody').parentElement.style.display = '';
  $('planList').style.display = 'none';
  codebox.classList.remove('show');
};
</script>
</body>
</html>
